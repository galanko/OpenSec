version = 1
revision = 3
requires-python = ">=3.9, <4.0"

# A small, structurally-faithful slice of instructor's uv.lock:
# workspace root 'demo' (editable) directly depends on aiohttp + urllib3;
# aiohttp pulls two transitive packages, exercising the resolved-edge path.

[[package]]
name = "demo"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "aiohttp" },
    { name = "urllib3" },
]

[package.optional-dependencies]
docs = [
    { name = "mkdocs" },
]

[package.metadata]
requires-dist = [
    { name = "aiohttp", specifier = ">=3.9.1,<4.0.0" },
    { name = "urllib3", specifier = ">=2.0.0" },
    { name = "mkdocs", marker = "extra == 'docs'", specifier = ">=1.6.1" },
]

[[package]]
name = "aiohttp"
version = "3.13.5"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "aiohappyeyeballs" },
    { name = "frozenlist" },
]

[[package]]
name = "aiohappyeyeballs"
version = "2.6.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "frozenlist"
version = "1.8.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "urllib3"
version = "2.6.3"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "mkdocs"
version = "1.6.1"
source = { registry = "https://pypi.org/simple" }
